[package]
name = "vysyn"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A minimal, bounded, GPU-accelerated image viewer for Linux and Windows"
repository = "https://github.com/chl84/Vysyn"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff", "ico", "pnm", "tga", "ff", "dds", "hdr"] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_20"] }
moxcms = "0.9.1"
pollster = "1.0.1"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }
roxmltree = "0.21.1"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "gles", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

# Stable winit does not receive Wayland file drops; see vendor/winit/VYSYN_PATCH.md.
[patch.crates-io]
winit = { path = "vendor/winit" }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "vysyn"
path = "src/main.rs"

[[bin]]
name = "vysyn-bench"
path = "src/bin/bench.rs"
