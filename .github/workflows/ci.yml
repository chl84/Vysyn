name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Native build tools and software graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libde265-dev libdav1d-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libegl1 libegl-mesa0 libgl1-mesa-dri libgles2 \
            libvulkan1 mesa-vulkan-drivers xvfb
      - name: Build pinned native decoder
        run: bash scripts/build-native-linux.sh
      - name: Configure native library
        run: |
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.native/install/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/.native/install/lib" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bins --examples
      - name: Software Vulkan presentation smoke test
        run: xvfb-run -a target/release/vysyn --trace --smoke-ms 5000 tests/fixtures/native-source.png
      - name: Software GLES presentation smoke test
        env:
          VYSYN_BACKEND: gles
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a target/release/vysyn --trace --smoke-ms 5000 tests/fixtures/native-source.png
      - run: python3 scripts/bundle-linux.py
      - name: Test bundled codec loading
        run: artifacts/vysyn-linux-x64/vysyn-bench tests/fixtures/sample.avif tests/fixtures/rotated.heic
      - uses: actions/upload-artifact@v7
        with:
          name: vysyn-linux-x64
          path: artifacts/vysyn-linux-x64.tar.gz
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/AppData/Local/vcpkg/archives
          key: windows-native-ed934a65-${{ hashFiles('Cargo.lock', 'vcpkg.json') }}
      - name: Build, test and bundle DLLs
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: vysyn-windows-x64
          path: artifacts/vysyn-windows-x64.zip
